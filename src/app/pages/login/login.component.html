<div class="login-container d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-lg p-4 rounded-4" style="width: 420px;">
    <div class="text-center mb-4">
      <img src="/assets/images/logo.png" alt="Logo" width="80" class="mb-3" />
      <h3 class="fw-bold">Connexion à votre compte</h3>
      <p class="text-muted small">Veuillez entrer vos identifiants</p>
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Adresse Email</label>
        <input
          type="email"
          class="form-control rounded-3"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="ex: nom@entreprise.com"
        />
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Mot de passe</label>
        <input
          type="password"
          class="form-control rounded-3"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="••••••••"
        />
      </div>

      <button type="submit" class="btn btn-primary w-100 rounded-3 fw-semibold">
        🔐 Se connecter
      </button>

      <div *ngIf="errorMessage" class="text-danger text-center mt-3">
        {{ errorMessage }}
      </div>
    </form>

    <div class="text-center mt-3">
      <small class="text-muted"> ETAP</small>
    </div>
  </div>
</div>
