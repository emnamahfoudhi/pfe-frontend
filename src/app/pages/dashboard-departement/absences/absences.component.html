<mat-toolbar color="primary">
  <span>📊 Absences - Statistiques</span>
  <span class="spacer"></span>
  <button mat-raised-button color="accent" (click)="ajouterAbsence()">
    <mat-icon>add</mat-icon> Ajouter
  </button>
</mat-toolbar>

<div class="dashboard-container">
  <mat-card class="card-with-chart">
    <mat-card-title>Liste des absences</mat-card-title>
    <div class="table-container">
      <table mat-table [dataSource]="absences" class="mat-elevation-z8 full-width-table">
        <!-- Colonnes ici -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> ID </th>
            <td mat-cell *matCellDef="let a"> {{a.id}} </td>
          </ng-container>
          <ng-container matColumnDef="dataeabsence">
            <th mat-header-cell *matHeaderCellDef> Date </th>
            <td mat-cell *matCellDef="let a"> {{a.dataeabsence}} </td>
          </ng-container>
          <ng-container matColumnDef="raison_absence">
            <th mat-header-cell *matHeaderCellDef> Raison </th>
            <td mat-cell *matCellDef="let a"> {{a.raison_absence}} </td>
          </ng-container>
          <ng-container matColumnDef="statut">
            <th mat-header-cell *matHeaderCellDef> Statut </th>
            <td mat-cell *matCellDef="let a"> {{a.statut}} </td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let a">
              <button mat-icon-button color="primary" (click)="modifierAbsence(a)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="supprimerAbsence(a.id)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>


      </table>
    </div>
  </mat-card>

  <mat-card class="card-with-chart">
    <mat-card-title>Courbe des absences</mat-card-title>
    <canvas baseChart
            [data]="chartData"
            [type]="'bar'"
            [options]="chartOptions">
    </canvas>
  </mat-card>
</div>
